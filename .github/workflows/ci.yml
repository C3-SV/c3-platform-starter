name: CI

# Comprobaciones en cada pull request y en main. No hay despliegue automático de producción.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias del dominio
        run: npm test

      - name: Pruebas de reglas y servicios con emuladores
        run: npm run test:rules

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      # Playwright ejecuta `npm run build` antes de servir la aplicación: este paso valida build y recorridos sin compilar dos veces.
      - name: Build de producción y recorridos E2E (escritorio y móvil)
        run: npm run test:e2e

      - name: Subir informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
